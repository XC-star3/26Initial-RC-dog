# ============================================================
# OpenOCD config for DAPLink / CMSIS-DAP HID fallback
# Use this when CMSIS-DAPv2 bulk mode reports command mismatch.
# ============================================================

adapter driver cmsis-dap
cmsis-dap backend hid
transport select swd

set CHIPNAME stm32h723
set DUAL_CORE 0
set DUAL_BANK 0
set WORKAREASIZE 0x10000

reset_config none

source [find target/stm32h7x.cfg]

adapter speed 50
cortex_m reset_config sysresetreq
