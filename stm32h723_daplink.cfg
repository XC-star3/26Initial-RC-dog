# ============================================================
# OpenOCD config for DAPLink / CMSIS-DAP
# Probe : DAPLink / CMSIS-DAP
# Chip  : STM32H723 / STM32H72x single-bank flash
# Mode  : SWD, no hardware reset
# ============================================================

adapter driver cmsis-dap
transport select swd

set CHIPNAME stm32h723
set DUAL_CORE 0
set DUAL_BANK 0
set WORKAREASIZE 0x10000

# Do not rely on SRST/NRST hardware reset.
reset_config none

source [find target/stm32h7x.cfg]

# DAPLink is more reliable at 1 MHz on this board/OpenOCD combo.
# Keep this after stm32h7x.cfg because that file sets a default speed.
adapter speed 1000

# Use Cortex-M software reset.
cortex_m reset_config sysresetreq
