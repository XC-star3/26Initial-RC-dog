terminal_source: ''
software_timer:
  priority: 2
  stack_depth: 1024

FDCAN:
  FDCAN1:
    queue_size: 16
  FDCAN2:
    queue_size: 16
  FDCAN3:
    queue_size: 16

USART:
  uart5:
    rx_buffer_size: 128
    tx_buffer_size: 0
    dma_section: .dma_buffer
    tx_queue_size: 16

SPI:
  spi6:
    rx_buffer_size: 184
    tx_buffer_size: 184
    dma_section: ''
    dma_enable_min_size: 256

USB:
  usb_otg_hs:
    enable: true
    ep0_packet_size: 64
    rx_buffer_size: 512
    tx_buffer_size: 512
    notification_buffer_size: 64
    rx_fifo_size: 2048
    ep0_tx_fifo_size: 512
    tx_fifo_size: 1024
    notification_tx_fifo_size: 512
    cdc_rx_fifo_size: 512
    cdc_tx_fifo_size: 512
    cdc_queue_size: 8
    dma_section: ''
    vid: 0x0483
    pid: 0x5740
    bcd: 0x0100
    manufacturer: XRobot
    product: RC-dog XRUSB CDC
    serial: UID-

device_aliases:
  fdcan1:
    type: FDCAN
    aliases:
      - fdcan_front
  fdcan2:
    type: FDCAN
    aliases:
      - fdcan_rear
  fdcan3:
    type: FDCAN
    aliases:
      - fdcan_wheel
  uart5:
    type: UART
    aliases:
      - sbus_uart
  spi6:
    type: SPI
    aliases:
      - rgb_spi
  usb_otg_hs_cdc:
    type: UART
    aliases:
      - usb_cdc

SYSTEM: FreeRTOS
